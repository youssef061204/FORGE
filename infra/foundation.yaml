AWSTemplateFormatVersion: "2010-09-09"
Description: FORGE prototype adapter foundation. No application deployment or live integration is implied.
Parameters:
  BedrockModelArn:
    Type: String
    MinLength: 1
    Description: Authorized model or inference profile ARN for this deployment.
Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AWS::StackName}-events"
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/forge/${AWS::StackName}"
      RetentionInDays: 14
  LogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref LogGroup
      LogStreamName: forge
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ForgeAdapters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventBus.Arn
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroup}:log-stream:forge"
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArn
Outputs:
  DynamoDBTable:
    Value: !Ref StateTable
  EventBusName:
    Value: !Ref EventBus
  CloudWatchGroup:
    Value: !Ref LogGroup
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
